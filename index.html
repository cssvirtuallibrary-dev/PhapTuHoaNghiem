const SIDDHAM_ASPECT = { YA: 135/160, SA: 141/160, VA: 124/160 }; // width/height

// Camera-facing glyph sprite, opacity-controllable per frame for fade-ins.
function makeSiddhamSprite(key, worldHeight){
  const tex = new THREE.TextureLoader().load(SIDDHAM_TEXTURES[key]);
  tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent:true, opacity:0, depthWrite:false });
  const sprite = new THREE.Sprite(mat);
  const aspect = SIDDHAM_ASPECT[key] || 1;
  sprite.scale.set(worldHeight*aspect, worldHeight, 1);
  sprite.renderOrder = 6;
  return sprite;
}

// Hoa Sen.stl — the lotus flower model, hosted in the same folder as
// index.html. Loaded once and cached (centered on its own origin, scaled to
// a consistent world-space diameter, reoriented so it "faces" scene +Z) so
// every flower instance below can share the single BufferGeometry and only
// needs its own material for color + bloom-opacity/scale.
const LOTUS_STL_FILENAME = 'hoa+sen.stl';
const LOTUS_STL_CANDIDATES = [ LOTUS_STL_FILENAME, encodeURI(LOTUS_STL_FILENAME) ];
const LOTUS_TARGET_DIAMETER = 0.33; // world units — ~40% smaller than the previous 0.55 footprint
// hoa+sen.stl is already authored Z-up (matching this scene's up axis), so
// no corrective pitch is applied. If a future model swap ever comes in
// Y-up instead, set this back to -Math.PI/2 to stand it upright again.
const LOTUS_STL_ROTATION_X = 0;
const sharedSTLLoader = ('THREE' in window && THREE.STLLoader) ? new THREE.STLLoader() : null;
let lotusGeometryLoadPromise = null;
function loadSharedLotusGeometry(){
  if (lotusGeometryLoadPromise) return lotusGeometryLoadPromise;
  if (!sharedSTLLoader) { lotusGeometryLoadPromise = Promise.reject(new Error('STLLoader unavailable')); return lotusGeometryLoadPromise; }
  const tryIndex = (idx) => {
    if (idx >= LOTUS_STL_CANDIDATES.length) return Promise.reject(new Error('Hoa Sen.stl failed to load from all sources'));
    const url = LOTUS_STL_CANDIDATES[idx];
    return new Promise((resolve, reject) => {
      sharedSTLLoader.load(url, (geometry) => resolve(geometry), undefined,
        (err) => { console.warn(`Hoa Sen.stl source failed: ${url}`, err); reject(err); });
    }).catch(() => tryIndex(idx + 1));
  };
  lotusGeometryLoadPromise = tryIndex(0).then((geometry) => {
    geometry.rotateX(LOTUS_STL_ROTATION_X);
    geometry.computeBoundingBox();
    const size = new THREE.Vector3(); geometry.boundingBox.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = LOTUS_TARGET_DIAMETER / maxDim;
    geometry.scale(scale, scale, scale);
    geometry.center();
    geometry.computeVertexNormals();
    return geometry;
  });
  return lotusGeometryLoadPromise;
}

// One colored Hoa Sen.stl mesh instance. Starts on a tiny placeholder
// geometry (so it can already be scaled/positioned/animated) and swaps in
// the real shared STL geometry the moment it finishes loading.
function createLotusFlowerMesh(colorHex){
  const color = new THREE.Color(colorHex);
  const mat = new THREE.MeshPhysicalMaterial({ color, emissive:color, emissiveIntensity:0.22, roughness:0.35, metalness:0.08, side:THREE.DoubleSide, transparent:true, opacity:0.9 });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.001, 6, 6), mat);
  loadSharedLotusGeometry()
    .then((geo) => { mesh.geometry.dispose(); mesh.geometry = geo; })
    .catch((err) => console.warn('Hoa Sen.stl could not be loaded; lotus flowers will remain as placeholder points.', err));
  return { mesh, mat };
}

// A lotus flower built from Hoa Sen.stl. `colors` is an array of CSS hex
// strings: length 1 for a single-color flower (BLUE/RED/PURPLE/WHITE), or
// length 4 for the merged heart-center bloom — in which case 4 copies of
// the model are stacked with a slight yaw/scale/height stagger per copy so
// all 4 colors read together as one multi-colored flower with no z-fighting.
function buildLotusFlowerGroup(colors){
  const group = new THREE.Group();
  const instances = colors.map((colorHex, i) => {
    const { mesh, mat } = createLotusFlowerMesh(colorHex);
    mesh.rotation.z = (i / colors.length) * Math.PI * 2; // yaw about the scene's vertical (Z) axis
    // Scale/height falloff is relative to layer count so this works
    // equally well for a single-color flower (1 layer) or the richly
    // multi-color merged bloom (12 layers).
    const layerScale = 1 - (i / colors.length) * 0.32;
    mesh.scale.setScalar(layerScale);
    mesh.position.z = i * 0.0018; // tiny vertical stagger to avoid z-fighting between stacked layers
    group.add(mesh);
    return { mat };
  });

  // A multi-color bloom (heart-center merge) gets a golden seed-pod plus a
  // ring of fine upright stamen filaments at its center, like a real lotus,
  // so the layered tints read as one naturally-colored flower with a full
  // floral center rather than flat stacked slices.
  let stamenMat = null, stamen = null, filamentMat = null;
  if (colors.length > 1){
    stamenMat = new THREE.MeshPhysicalMaterial({ color:0xffc107, emissive:0xff9800, emissiveIntensity:0.5, roughness:0.35, metalness:0.4, transparent:true, opacity:0.95 });
    stamen = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), stamenMat);
    stamen.position.z = 0.055;
    group.add(stamen);

    filamentMat = new THREE.MeshStandardMaterial({ color:0xffb300, emissive:0xff9800, emissiveIntensity:0.4, roughness:0.4, metalness:0.3, transparent:true, opacity:0.9 });
    const FIL_COUNT = 18;
    for (let fi=0; fi<FIL_COUNT; fi++){
      const ang = (fi/FIL_COUNT) * Math.PI*2;
      const fr = 0.07;
      const fil = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.006, 0.05, 6), filamentMat);
      fil.position.set(Math.cos(ang)*fr, Math.sin(ang)*fr, 0.05);
      fil.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1));
      group.add(fil);
    }
  }

  function setBloom(progress){
    const p = Math.max(0, Math.min(1, progress));
    const scale = 0.08 + 0.92*p;
    group.scale.setScalar(scale);
    instances.forEach(({ mat }) => { mat.opacity = 0.25 + 0.7*p; });
    if (stamenMat) stamenMat.opacity = 0.2 + 0.75*p;
    if (filamentMat) filamentMat.opacity = (0.2 + 0.75*p) * 0.9;
  }
  setBloom(0);
  return { group, setBloom };
}

function buildLotusSequenceAnimation(root){
  const YA_POS = new THREE.Vector3(0, 0, -0.5);
  const SA_POS = new THREE.Vector3(0, 0, 1.0);
  const HEART_POS = new THREE.Vector3(0, 0, 0.2);
  const VA_POS = new THREE.Vector3(0, 0, 0.35);

  const PETAL_SPECS = [
    { color:'#3b82f6', target:new THREE.Vector3(-1, 0, 0) }, // BLUE
    { color:'#FF0000', target:new THREE.Vector3(0, -1, 0) }, // RED (pure red)
    { color:'#4a148c', target:new THREE.Vector3(1, 0, 0) },  // PURPLE (deep true purple)
    { color:'#f5f5f5', target:new THREE.Vector3(0, 1, 0) }   // WHITE
  ];

  // Water droplet travel endpoints: SA -> YA, straight down the vertical axis.
  const DROP_START = SA_POS.clone();
  const DROP_END   = YA_POS.clone();

  // A richer, naturally-blended palette for the merged heart-center bloom —
  // modeled on a real multi-color lotus photo reference: cycles through
  // blue, indigo, deep purple, magenta/crimson, red, coral, pale lavender,
  // white, and ice-blue so the flower reads as one smoothly graded bloom
  // (like overlapping petals of different hues) rather than 4 flat quadrants.
  function buildNaturalMergedPalette(){
    return [
      '#1e88e5', // blue
      '#3949ab', // blue-indigo
      '#4a148c', // deep purple
      '#8e24aa', // purple-magenta
      '#ad1457', // magenta-crimson
      '#c62828', // true red
      '#ef6c4d', // coral
      '#ffccbc', // pale peach-pink
      '#f5f5f5', // white
      '#cfe8fb', // ice blue
      '#64b5f6', // light blue
      '#1e88e5'  // back toward blue for a smooth wraparound
    ];
  }

  const group = new THREE.Group();
  root.add(group);

  // Siddham glyphs
  const yaSprite = makeSiddhamSprite('YA', 0.204); yaSprite.position.copy(YA_POS); group.add(yaSprite); // ~40% smaller (was 0.34)
  const saSprite = makeSiddhamSprite('SA', 0.204); saSprite.position.copy(SA_POS); group.add(saSprite); // ~40% smaller (was 0.34)
  const vaSprite = makeSiddhamSprite('VA', 0.18); vaSprite.position.copy(VA_POS); group.add(vaSprite); // ~40% smaller (was 0.30)

  // Single drop of water traveling SA -> YA (top to bottom), sculpted as a
  // proper falling-raindrop silhouette: a rounded, flattened leading belly
  // (the side facing the direction of travel) tapering to a fine trailing
  // point (the side facing backward, i.e. "up"), like a real drop of water
  // stretched by its own fall — plus a small bright catch-light highlight
  // for a wet, glossy look.
  function buildWaterDropGeometry(radius){
    const pts = [
      new THREE.Vector2(0.00, 1.00),   // trailing tip (points backward/up)
      new THREE.Vector2(0.14, 0.68),
      new THREE.Vector2(0.32, 0.30),
      new THREE.Vector2(0.46, -0.05),
      new THREE.Vector2(0.42, -0.42),
      new THREE.Vector2(0.24, -0.75),
      new THREE.Vector2(0.00, -0.95)   // rounded leading belly (faces direction of travel)
    ].map(p => new THREE.Vector2(p.x*radius, p.y*radius));
    const geo = new THREE.LatheGeometry(pts, 24);
    geo.computeVertexNormals();
    return geo;
  }
  const dropMat = new THREE.MeshPhysicalMaterial({ color:0xbfe9ff, transmission:0.92, roughness:0.03, thickness:0.22, ior:1.33, transparent:true, opacity:0, clearcoat:1.0, clearcoatRoughness:0.05 });
  const dropMesh = new THREE.Mesh(buildWaterDropGeometry(0.07), dropMat);
  // Orient the drop so its trailing tip points opposite the direction of
  // travel (i.e. "backward/up"), and its rounded belly leads the fall —
  // exactly like a real drop of water dropping down.
  const dropTravelDir = new THREE.Vector3().subVectors(DROP_END, DROP_START).normalize();
  dropMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dropTravelDir.clone().negate());
  group.add(dropMesh);
  const dropHighlightMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0 });
  const dropHighlight = new THREE.Mesh(new THREE.SphereGeometry(0.014, 10, 10), dropHighlightMat);
  dropHighlight.position.set(0.022, 0.022, 0.02);
  dropMesh.add(dropHighlight);
  const dropLight = new THREE.PointLight(0xaee3ff, 0, 1.2);
  group.add(dropLight);

  // 4 stems, each pre-split into short segments along a curve from YA out
  // to its compass target, so "growth" is revealed by toggling segment
  // visibility (no per-frame geometry rebuilds needed).
  const STEM_SEGMENTS = 14;
  const stemMat = new THREE.MeshStandardMaterial({ color:0x2e7d32, roughness:0.6, metalness:0.05 });
  // Winds each stem's growth path spirally around the scene's central
  // vertical (Z) axis (like a vine circling the Buddha's own centerline as
  // it climbs), rather than twisting around its own local YA -> flower
  // axis. Implemented as a pure rotation of each point's (x, y) around the
  // Z axis, with the rotation angle fading to zero at both endpoints —
  // this keeps the stem's start (YA, which already sits on the Z axis) and
  // end (the flower's exact position) unchanged, while the middle of the
  // path sweeps around the center.
  const STEM_SPIRAL_TURNS = 0.05; // ~1/20 turn corkscrew twist at the peak of the smooth sine sweep
  function applySpiralAroundCentralAxis(points){
    return points.map((p, i) => {
      const tt = i / (points.length - 1);
      const angle = STEM_SPIRAL_TURNS * Math.PI * 2 * Math.sin(Math.PI * tt); // 0 at both ends, peaks mid-path
      const cos = Math.cos(angle), sin = Math.sin(angle);
      return new THREE.Vector3(p.x * cos - p.y * sin, p.x * sin + p.y * cos, p.z);
    });
  }
  const stems = PETAL_SPECS.map(spec => {
    // Direct growth path from YA out to this flower's position, but with
    // the final approach rising straight up (Z-up) into the flower's base
    // -- like a real stem growing upward into its blossom -- rather than
    // curving in flat/sideways from the side.
    const mid = new THREE.Vector3().lerpVectors(YA_POS, spec.target, 0.42);
    mid.z += 0.12; // gentle natural arch through the middle of the path
    const preTarget = spec.target.clone();
    preTarget.z -= 0.32; // approach point directly below the flower
    const curve = new THREE.CatmullRomCurve3([
      YA_POS.clone(),
      mid,
      preTarget,
      spec.target.clone()
    ]);
    const points = applySpiralAroundCentralAxis(curve.getPoints(STEM_SEGMENTS));
    const segMeshes = [];
    for (let i=0; i<STEM_SEGMENTS; i++){
      const a = points[i], b = points[i+1];
      const dir = new THREE.Vector3().subVectors(b, a);
      const len = dir.length() || 0.001;
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.022, len, 8), stemMat);
      cyl.position.copy(a).addScaledVector(dir, 0.5);
      cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
      cyl.visible = false;
      group.add(cyl);
      segMeshes.push(cyl);
    }
    return segMeshes;
  });

  // 4 flowers (Hoa Sen.stl, each tinted its own color) blooming at the
  // compass targets: BLUE @ -X, RED @ -Y, PURPLE @ +X, WHITE @ +Y.
  const flowers = PETAL_SPECS.map(spec => {
    const f = buildLotusFlowerGroup([spec.color]);
    f.group.position.copy(spec.target);
    group.add(f.group);
    return { ...f, homePos: spec.target.clone() };
  });

  // Merged multi-color lotus (8 stacked Hoa Sen.stl copies with a naturally
  // blended palette) that blooms at the heart center once the 4 flowers
  // spiral inward and combine.
  const mergedColors = buildNaturalMergedPalette();
  const mergedFlower = buildLotusFlowerGroup(mergedColors);
  mergedFlower.group.position.copy(HEART_POS);
  mergedFlower.group.scale.setScalar(0.001);
  group.add(mergedFlower.group);

  // ---- Timeline (seconds); loops seamlessly via elapsed % CYCLE ----
  const T_YA_IN        = [0.0, 1.0];
  const T_SA_IN        = [1.0, 2.0];
  const T_DROP         = [2.2, 4.2];
  const T_STEM_GROW    = [4.6, 7.2];
  const T_FLOWER_BLOOM = [6.2, 8.4];
  const T_MERGE        = [9.0, 11.4];
  const T_MERGED_BLOOM = [11.0, 12.6];
  const T_VA_IN        = [12.6, 13.6];
  const CYCLE = 16.5;

  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const smooth = (x) => x*x*(3-2*x);
  const progressOf = (t, span) => clamp01((t - span[0]) / (span[1] - span[0]));
  const lerp = (a, b, k) => a + (b - a) * k;

  function update(elapsedRaw){
    const t = elapsedRaw % CYCLE;

    yaSprite.material.opacity = smooth(progressOf(t, T_YA_IN));
    saSprite.material.opacity = smooth(progressOf(t, T_SA_IN));

    const dp = progressOf(t, T_DROP);
    const dropActive = t >= T_DROP[0] && t <= T_DROP[1] + 0.15;
    dropMat.opacity = dropActive ? (dp < 0.92 ? 0.95 : lerp(0.95, 0, (dp-0.92)/0.08)) : 0;
    dropHighlightMat.opacity = dropMat.opacity * 0.9;
    dropLight.intensity = dropActive ? 1.1 * (1 - Math.abs(dp-0.5)*0.6) : 0;
    if (dropActive){
      dropMesh.position.lerpVectors(DROP_START, DROP_END, smooth(dp));
      dropLight.position.copy(dropMesh.position);
    }

    const sp = progressOf(t, T_STEM_GROW);
    const segCount = Math.round(sp * STEM_SEGMENTS);
    const stemsShouldShow = t < T_MERGE[0]; // stems disappear once the 4 flowers start merging
    stems.forEach(segMeshes => segMeshes.forEach((m, i) => { m.visible = stemsShouldShow && (i < segCount); }));

    const fp = smooth(progressOf(t, T_FLOWER_BLOOM));
    flowers.forEach(f => f.setBloom(fp));

    const mp = smooth(progressOf(t, T_MERGE));
    flowers.forEach((f, idx) => {
      if (mp <= 0){
        f.group.position.copy(f.homePos);
        f.group.scale.setScalar(1);
        f.group.visible = fp > 0;
        return;
      }
      const spiralTurns = 1.4;
      const startAngle = Math.atan2(f.homePos.y, f.homePos.x);
      const startRadius = Math.hypot(f.homePos.x, f.homePos.y);
      const radius = lerp(startRadius, 0, mp);
      const angle = startAngle + mp * spiralTurns * Math.PI * 2;
      f.group.position.set(radius*Math.cos(angle), radius*Math.sin(angle), lerp(f.homePos.z, HEART_POS.z, mp));
      f.group.scale.setScalar(lerp(1, 0.15, mp));
      f.group.visible = mp < 0.98;
    });

    const mbp = smooth(progressOf(t, T_MERGED_BLOOM));
    mergedFlower.group.scale.setScalar(lerp(0.001, 1, mbp));
    mergedFlower.setBloom(mbp);

    vaSprite.material.opacity = smooth(progressOf(t, T_VA_IN));
  }
  update(0);

  return {
    extent: 1.5,
    update,
    dispose(){
      root.remove(group);
      group.traverse(obj => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) { if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose()); else obj.material.dispose(); }
      });
    }
  };
}

function buildTriggerAnimation(name, root, colorHex){
  switch(name){
    case 'EGO': return buildEgoAnimation(root);
    case 'LASER': return buildLaserAnimation(root, colorHex);
    case 'SPIRAL': return buildSpiralAnimation(root, colorHex);
    case 'TORUS_IN': return buildTorusAnimation(root, 'in', colorHex);
    case 'TORUS_OUT': return buildTorusAnimation(root, 'out', colorHex);
    case 'COLUMN_OF_LIGHT': return buildColumnOfLightAnimation(root, colorHex);
    case 'LOTUS_SEQUENCE': return buildLotusSequenceAnimation(root, colorHex);
    default: return buildGenericPulseAnimation(root, colorHex, name);
  }
}

/* =========================================================================
   7. PER-CARD MINI 3D VISUALIZATION
   ========================================================================= */
function initCardViz(container, fields, triggers, statusEl){
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x03060d, 0.06);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 30);
  camera.up.set(0, 0, 1);

  // Frame the camera to comfortably fit the Buddha PLUS whichever animation
  // extents are active on this card (e.g. Torus Out reaches further than a
  // plain Buddha, Column of Light reaches up to Z~2.0 / R~2.2, etc.)
  const activeExtents = [1.0]; // baseline: fit the ~1.5-unit-tall Buddha comfortably
  const camDistance = () => Math.max(2.6, Math.max(...activeExtents) * 1.55 + 1.4);
  function positionCamera(){
    const d = camDistance();
    camera.position.set(d*0.62, d*0.72, d*0.42);
    camera.updateProjectionMatrix();
  }

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.enableZoom = false; controls.enablePan = false;
  controls.autoRotate = false; controls.autoRotateSpeed = 0.5; // auto-rotation disabled per request
  controls.target.set(0, 0, 0.25);

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const key = new THREE.DirectionalLight(0xfff6e5, 2.0); key.position.set(4,5,6); scene.add(key);
  const fill = new THREE.DirectionalLight(0x90c8ff, 1.1); fill.position.set(-4,-4,-2); scene.add(fill);
  const coreLight = new THREE.PointLight(0x00e5ff, 1.6, 6); coreLight.position.set(0,0,0.25); scene.add(coreLight);

  const crystalMat = makeCrystalMaterial();
  const rootGroup = new THREE.Group(); // Buddha convention: Crown Z=1.0, Seat Z=-0.5, Front +Y, Right +X

  const placeholderBuddha = buildBuddhaStatue(crystalMat);
  rootGroup.add(placeholderBuddha);
  if (statusEl) statusEl.textContent = 'Đang tải mô hình Phật 3D…';

  // Always-on coordinate axis labels (+X/-X/+Y/-Y/+Z/-Z) so orientation is
  // unambiguous while orbiting the model.
  const AXIS_LABEL_RADIUS = 1.8;
  rootGroup.add(buildAxisLabelsGroup(AXIS_LABEL_RADIUS));
  activeExtents.push(AXIS_LABEL_RADIUS + 0.3);

  loadSharedBuddhaModel().then((sceneRoot) => {
    const modelInstance = sceneRoot.clone(true);
    fitBuddhaModelToScene(modelInstance);
    applyBuddhaTransparency(modelInstance);
    rootGroup.add(modelInstance);
    rootGroup.remove(placeholderBuddha);
    if (statusEl && !triggers.length) statusEl.textContent = '';
  }).catch((err) => {
    console.warn('Buddha GLB model could not be loaded from any source; keeping procedural placeholder.', err);
    if (statusEl && !triggers.length) statusEl.textContent = 'Không tải được mô hình GLB — dùng hình mẫu tạm thời';
  });

  // Dharma-object marker from Visualization coordinate (if given)
  if (fields.viz.coords) {
    const [nx, ny, nz] = fields.viz.coords;
    const markerColor = new THREE.Color(fields.viz.colorHex || '#ffd700');
    const markerMat = new THREE.MeshPhysicalMaterial({ color: markerColor, emissive: markerColor, emissiveIntensity: 0.6, roughness: 0.2, metalness: 0.25 });
    const markerMesh = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 24), markerMat);
    markerMesh.position.set(nx || 0, ny || 0, nz || 0);
    rootGroup.add(markerMesh);
    const markerLight = new THREE.PointLight(markerColor.getHex(), 1.2, 2);
    markerLight.position.copy(markerMesh.position);
    rootGroup.add(markerLight);
    activeExtents.push(Math.hypot(nx||0, ny||0, nz||0) + 0.3);
  }

  // Animation triggers from the Visualization cell.
  // +LOTUS_SEQUENCE is handled as a special, time-orchestrated case below
  // (Buddha model loads -> 1s delay -> Bubble of Ego -> 1s delay -> rest of
  // the Lotus sequence), so it is skipped here and NOT built immediately.
  const activeAnims = [];
  triggers.forEach(trig => {
    if (trig === 'LOTUS_SEQUENCE') return;
    const anim = buildTriggerAnimation(trig, rootGroup, fields.viz.colorHex);
    if (anim) { activeAnims.push(anim); if (anim.extent) activeExtents.push(anim.extent); }
  });
  if (triggers.length && statusEl) statusEl.textContent = `▶ Hiệu ứng: ${triggers.map(t=>triggerDisplayLabel(t)).join(' ')}`;

  scene.add(rootGroup);
  positionCamera();

  // Wraps an animation object so its own internal clock starts at 0 the
  // moment it is actually added to the scene, rather than inheriting the
  // card's global elapsed time (which keeps counting from card creation).
  function wrapAnimWithLocalStart(anim, offsetSeconds){
    return {
      extent: anim.extent,
      update(elapsed){ anim.update(Math.max(0, elapsed - offsetSeconds)); },
      dispose(){ anim.dispose(); }
    };
  }

  const LOTUS_SEQUENCE_STEP_DELAY_MS = 1000; // delay after the Buddha loads, before the Bubble of Ego begins forming

  if (triggers.includes('LOTUS_SEQUENCE')) {
    // Step 1: wait for the Buddha model to finish loading (proceed anyway,
    // with the procedural placeholder, if it ever fails to load).
    loadSharedBuddhaModel().catch(() => {}).then(() => {
      setTimeout(() => {
        // Step 2: build the Bubble of Ego ONCE, with holdOpen so it forms
        // smoothly to fully open and then stays open/static for the rest of
        // the sequence — it is never rebuilt/closed again until the whole
        // card is reset (cleanup/dispose).
        const egoOffset = (performance.now() - clockStart) / 1000;
        const egoAnim = buildEgoAnimation(rootGroup, { holdOpen: true });
        activeAnims.push(wrapAnimWithLocalStart(egoAnim, egoOffset));
        if (egoAnim.extent) activeExtents.push(egoAnim.extent);

        // Step 3: wait until the Bubble of Ego is FULLY FORMED before
        // building and adding the rest of the Lotus sequence (YA -> water
        // drop -> SA -> 4-lotus growth -> spiral merge -> VA).
        setTimeout(() => {
          const lotusOffset = (performance.now() - clockStart) / 1000;
          const lotusAnim = buildLotusSequenceAnimation(rootGroup, fields.viz.colorHex);
          activeAnims.push(wrapAnimWithLocalStart(lotusAnim, lotusOffset));
          if (lotusAnim.extent) activeExtents.push(lotusAnim.extent);
        }, EGO_FORM_DURATION_SECONDS * 1000);
      }, LOTUS_SEQUENCE_STEP_DELAY_MS);
    });
  }

  const clockStart = performance.now();
  let isVisible = true;
  let rafId = null;

  function resize(){
    const w = container.clientWidth || 1;
    const h = container.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  const ro = new ResizeObserver(resize);
  ro.observe(container);

  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { isVisible = en.isIntersecting; if (isVisible && !rafId) animate(); });
  }, { threshold: 0.05 });
  io.observe(container);

  function animate(){
    if (!isVisible) { rafId = null; return; }
    rafId = requestAnimationFrame(animate);
    const elapsed = (performance.now() - clockStart) / 1000;
    coreLight.intensity = Math.sin(elapsed*2)*0.5 + 1.3;
    activeAnims.forEach(a => a.update(elapsed));
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  return {
    cleanup(){
      if (rafId) cancelAnimationFrame(rafId);
      ro.disconnect(); io.disconnect();
      activeAnims.forEach(a => a.dispose());
      renderer.dispose(); controls.dispose();
    }
  };
}

/* =========================================================================
   8. OVERVIEW PANEL — WHOLE-SEQUENCE COLUMN OF LIGHT SPIRAL
      Activated when any row's Visualization cell contains a whole-sequence
      token (+SPIRAL_ALL / +COLUMN_ALL / +SPIRAL_SEQUENCE / +COLUMN_OF_LIGHT_ALL).
      Uses the exact same calibrated 40-node getSpiralPosition() geometry as
      the original Lotus Bodhicitta System, with Play/Pause/Step controls.
   ========================================================================= */
function renderOverviewSection(container, isActive){
  if (!isActive) { container.innerHTML = ''; return; }
  const N = COLUMN_OF_LIGHT_NODE_COUNT;

  container.innerHTML = `
    <div class="overview-panel">
      <button class="overview-toggle-pill" id="overviewToggleBtn">
        <span>🌀 Cột Ánh Sáng Xoắn Ốc — Toàn Chuỗi (${N} nút)</span><span id="overviewCaret">▾</span>
      </button>
      <div class="overview-body" id="overviewBody" style="display:none;">
        <div class="overview-canvas-wrap" id="overviewCanvasWrap"></div>
        <div class="overview-controls">
          <button id="ovPrev">◀ Nút trước</button>
          <button id="ovPlayPause">▶ Chạy</button>
          <button id="ovNext">Nút sau ▶</button>
          <span class="overview-label" id="ovNodeLabel">Sẵn sàng — ${N} nút trong Cột Ánh Sáng</span>
        </div>
      </div>
    </div>`;

  const toggleBtn = document.getElementById('overviewToggleBtn');
  const body = document.getElementById('overviewBody');
  const caret = document.getElementById('overviewCaret');
  let started = false;

  toggleBtn.addEventListener('click', () => {
    const willOpen = body.style.display === 'none';
    body.style.display = willOpen ? 'block' : 'none';
    caret.textContent = willOpen ? '▲' : '▾';
    if (willOpen && !started) {
      started = true;
      overviewController = initOverviewViz(document.getElementById('overviewCanvasWrap'));
    }
  });
}

function initOverviewViz(container){
  const N = COLUMN_OF_LIGHT_NODE_COUNT;
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x04020a, 0.035);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 40);
  camera.position.set(4.6, 5.4, 3.0);
  camera.up.set(0, 0, 1);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.target.set(0, 0, 0.3);

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const key = new THREE.DirectionalLight(0xfff6e5, 1.8); key.position.set(4,5,6); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffcc66, 1.0); fill.position.set(-4,-4,-2); scene.add(fill);

  const crystalMat = makeCrystalMaterial();
  const rootGroup = new THREE.Group();
  const placeholderBuddha = buildBuddhaStatue(crystalMat);
  rootGroup.add(placeholderBuddha);
  loadSharedBuddhaModel().then((sceneRoot) => {
    const modelInstance = sceneRoot.clone(true);
    fitBuddhaModelToScene(modelInstance);
    applyBuddhaTransparency(modelInstance);
    rootGroup.add(modelInstance);
    rootGroup.remove(placeholderBuddha);
  }).catch(() => { /* keep placeholder */ });
  scene.add(rootGroup);

  // Always-on coordinate axis labels so orientation (+X/-X/+Y/-Y/+Z/-Z) is
  // unambiguous while orbiting the full Column of Light spiral.
  rootGroup.add(buildAxisLabelsGroup(3.0, 0.55));

  // 40 calibrated node markers + progressive spiral line, exactly matching getSpiralPosition()
  const nodePositions = [];
  for (let i=0;i<N;i++) nodePositions.push(getSpiralPosition(i));

  const linePositions = new Float32Array(N*3);
  const lineGeo = new THREE.BufferGeometry(); lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions,3));
  const lineMat = new THREE.LineBasicMaterial({ color: 0xffd700, transparent:true, opacity:0.95, blending: THREE.AdditiveBlending });
  const spiralLine = new THREE.Line(lineGeo, lineMat);
  rootGroup.add(spiralLine);

  const travelTip = new THREE.Mesh(new THREE.SphereGeometry(0.055,16,16), new THREE.MeshBasicMaterial({ color:0xffffff }));
  rootGroup.add(travelTip);

  const nodeMeshes = nodePositions.map((p, i) => {
    const mat = new THREE.MeshPhysicalMaterial({ color:0xffe082, emissive:0xffcc00, emissiveIntensity:0.1, roughness:0.3, metalness:0.2 });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.06, 18, 18), mat);
    mesh.position.copy(p);
    rootGroup.add(mesh);
    return { mesh, mat, i, lit:false };
  });

  // Glowing ribbon "wall" of light, built with the exact same tapering
  // geometry as the original Lotus Bodhicitta System (rebuildWallGeometry),
  // growing in lockstep with the node stepper below.
  const wallMat = makeColumnOfLightWallMaterial(0xffe240);
  let wallMesh = new THREE.Mesh(buildColumnOfLightWallGeometry(0), wallMat);
  rootGroup.add(wallMesh);

  let currentIdx = -1;
  let playing = false;
  const speed = 3.2; // nodes per second

  function updateVisual(){
    const count = Math.max(2, currentIdx+1);
    for (let i=0;i<count;i++){ const v = nodePositions[i]; linePositions[i*3]=v.x; linePositions[i*3+1]=v.y; linePositions[i*3+2]=v.z; }
    lineGeo.setDrawRange(0, count); lineGeo.attributes.position.needsUpdate = true;

    if (currentIdx >= 0) travelTip.position.copy(nodePositions[Math.min(N-1,currentIdx)]);
    nodeMeshes.forEach(nm => {
      const shouldLight = nm.i <= currentIdx;
      if (shouldLight && !nm.lit) { nm.lit = true; nm.mat.emissiveIntensity = 0.9; nm.mesh.scale.setScalar(1.5); }
    });

    wallMesh.geometry.dispose();
    wallMesh.geometry = buildColumnOfLightWallGeometry(Math.max(0, currentIdx));

    const label = document.getElementById('ovNodeLabel');
    if (label) label.textContent = currentIdx>=0 ? `Đang tại nút #${currentIdx+1} / ${N}` : `Sẵn sàng — ${N} nút trong Cột Ánh Sáng`;
  }
  updateVisual();

  const playPauseBtn = document.getElementById('ovPlayPause');
  const prevBtn = document.getElementById('ovPrev');
  const nextBtn = document.getElementById('ovNext');
  function setPlaying(v){ playing = v; if (playPauseBtn) playPauseBtn.textContent = playing ? '⏸ Tạm dừng' : '▶ Chạy'; }
  playPauseBtn && playPauseBtn.addEventListener('click', () => setPlaying(!playing));
  prevBtn && prevBtn.addEventListener('click', () => { setPlaying(false); currentIdx = Math.max(0, currentIdx-1); updateVisual(); });
  nextBtn && nextBtn.addEventListener('click', () => { setPlaying(false); currentIdx = Math.min(N-1, currentIdx+1); updateVisual(); });

  let isVisible = true, rafId = null, lastT = performance.now(), acc = 0;
  function resize(){
    const w = container.clientWidth || 1, h = container.clientHeight || 1;
    renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  resize();
  const ro = new ResizeObserver(resize); ro.observe(container);
  const io = new IntersectionObserver((entries) => { entries.forEach(en => { isVisible = en.isIntersecting; if (isVisible && !rafId) animate(); }); }, { threshold:0.05 });
  io.observe(container);

  function animate(){
    if (!isVisible) { rafId = null; return; }
    rafId = requestAnimationFrame(animate);
    const now = performance.now(); const dt = Math.min(0.05, (now-lastT)/1000); lastT = now;
    if (playing) {
      acc += dt*speed;
      if (acc >= 1) { acc = 0; currentIdx = Math.min(N-1, currentIdx+1); updateVisual(); if (currentIdx>=N-1) setPlaying(false); }
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  return {
    cleanup(){
      if (rafId) cancelAnimationFrame(rafId);
      ro.disconnect(); io.disconnect();
      wallMesh.geometry.dispose(); wallMat.dispose();
      renderer.dispose(); controls.dispose();
    }
  };
}

window.addEventListener('DOMContentLoaded', initSheetData);
</script>
</body>
</html>
