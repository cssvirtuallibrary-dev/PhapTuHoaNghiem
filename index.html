<style>
  :root{
    --bg-color:#0b0c10; --card-bg:#151722; --card-border:rgba(255,255,255,0.08);
    --viz-bg-a:#081122; --viz-bg-b:#03060d;
    --text-purple:#ce93d8; --text-gold:#ffecb3; --text-gold-bright:#ffe082;
    --text-green:#81c784; --text-light-green:#c8e6c9; --text-peach-soft:#ffccbc;
    --text-orange-bold:#ffab91; --text-muted:#90a4ae; --accent-gold:#ffd700; --accent-cyan:#00e5ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{ background-color:var(--bg-color); color:#eceff1; font-family:'Noto Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding-bottom:60px; }

  header{ position:sticky; top:0; z-index:100; background:rgba(11,12,16,0.96); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    padding:10px 14px; border-bottom:1px solid var(--card-border); box-shadow:0 4px 20px rgba(0,0,0,0.5);
    transition:transform .3s cubic-bezier(.25,1,.5,1), opacity .3s ease; }
  header.header-hidden{ transform:translateY(-105%); opacity:0; pointer-events:none; }
  .header-container{ max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
  .header-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .app-title{ font-size:1.05rem; font-weight:800; color:var(--text-gold); letter-spacing:.3px; white-space:nowrap; }
  .header-actions{ display:flex; align-items:center; gap:8px; }
  .counter-pill{ font-size:.8rem; background:rgba(255,236,179,.15); color:var(--text-gold); border:1px solid rgba(255,236,179,.28); padding:3px 10px; border-radius:14px; font-weight:700; white-space:nowrap; }
  .sync-dot{ width:9px; height:9px; border-radius:50%; background:#ffd700; box-shadow:0 0 8px #ffd700; display:inline-block; }
  .sync-pill{ display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--text-muted); }
  .toggle-btn{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:var(--text-gold);
    width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:.9rem; }
  .controls-grid{ display:grid; grid-template-columns:1fr; gap:8px; }
  .controls-grid.collapsed{ display:none; }
  @media (min-width:680px){
    .header-container{ flex-direction:row; align-items:center; justify-content:space-between; }
    .controls-grid{ grid-template-columns:1.2fr 1fr; flex:1; max-width:680px; margin-left:16px; }
  }
  .custom-select,.search-box{ width:100%; background:#1e202c; color:#fff; border:1px solid rgba(255,255,255,.15);
    border-radius:10px; padding:9px 12px; font-size:.92rem; outline:none; transition:border-color .2s ease; }
  .custom-select:focus,.search-box:focus{ border-color:var(--text-gold); }
  .search-box::placeholder{ color:#78909c; }

  #quickFilterBtn{ position:fixed; top:14px; right:14px; z-index:99; background:rgba(30,32,44,.9); border:1px solid rgba(255,236,179,.3);
    color:var(--text-gold); padding:6px 12px; border-radius:20px; font-size:.82rem; font-weight:700;
    box-shadow:0 4px 12px rgba(0,0,0,.4); cursor:pointer; display:none; backdrop-filter:blur(8px); }

  main{ width:100%; max-width:1100px; margin:0 auto; padding:12px 10px; }
  .status-box{ text-align:center; padding:70px 16px; color:var(--text-muted); font-size:.95rem; }
  .spinner{ width:34px; height:34px; border:3px solid rgba(206,147,216,.2); border-top-color:var(--text-purple); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ============ OVERVIEW: COLUMN OF LIGHT SPIRAL (WHOLE SEQUENCE) ============ */
  .overview-panel{ margin-bottom:18px; border-radius:16px; border:1px solid rgba(255,215,0,.35); background:linear-gradient(180deg, rgba(40,30,6,.35), rgba(10,8,4,.55)); overflow:hidden; box-shadow:0 6px 24px rgba(255,180,0,.15); }
  .overview-toggle-pill{ width:100%; text-align:left; padding:12px 16px; background:transparent; border:none; color:#ffe9a8; font-weight:800; font-size:.92rem; cursor:pointer; display:flex; align-items:center; justify-content:space-between; letter-spacing:.3px; }
  .overview-toggle-pill:hover{ background:rgba(255,215,0,.08); }
  .overview-body{ border-top:1px solid rgba(255,215,0,.25); }
  .overview-canvas-wrap{ position:relative; width:100%; height:340px; background:radial-gradient(circle at 50% 40%, #241a04 0%, #04020a 70%, #010005 100%); touch-action:none; }
  .overview-canvas-wrap canvas{ display:block; width:100%; height:100%; }
  .overview-controls{ display:flex; align-items:center; gap:10px; padding:10px 14px; flex-wrap:wrap; background:rgba(10,8,4,.5); }
  .overview-controls button{ background:rgba(255,215,0,.15); border:1px solid rgba(255,215,0,.45); color:#ffe9a8; padding:7px 13px; border-radius:8px; font-weight:700; font-size:.82rem; cursor:pointer; }
  .overview-controls button:hover{ background:rgba(255,215,0,.3); }
  .overview-label{ font-size:.82rem; color:#ffe9a8; font-weight:600; margin-left:auto; }
  @media (min-width:680px){ .overview-canvas-wrap{ height:440px; } }

  /* ================= CARD STRUCTURE ================= */
  .card{ background:var(--card-bg); border-radius:18px; border:1px solid var(--card-border); box-shadow:0 6px 20px rgba(0,0,0,.4); margin-bottom:22px; overflow:hidden; }
  .full-width-pill{ display:block; width:calc(100% - 28px); margin:14px auto 0 auto; text-align:center; font-size:clamp(.85rem,2.5vw,1rem); color:var(--text-gold);
    background:rgba(255,236,179,.10); border:1px solid rgba(255,236,179,.26); padding:7px 14px; border-radius:24px; font-weight:700; letter-spacing:.3px; word-break:break-word; }

  .card-split{ display:flex; flex-direction:column; width:100%; }
  .viz-pane{ position:relative; width:100%; height:320px; background:radial-gradient(circle at 50% 40%, var(--viz-bg-a) 0%, var(--viz-bg-b) 70%, #010206 100%); touch-action:none; overflow:hidden; }
  .instr-pane{ width:100%; padding:16px 16px 22px 16px; display:flex; flex-direction:column; }

  @media (orientation:landscape){
    .card-split{ flex-direction:row; align-items:stretch; }
    .viz-pane{ width:46%; height:auto; min-height:440px; flex-shrink:0; }
    .instr-pane{ width:54%; border-left:1px solid rgba(255,255,255,.06); }
  }
  @media (orientation:landscape) and (max-height:520px){ .viz-pane{ min-height:320px; } }

  .viz-canvas-holder{ position:absolute; inset:0; }
  .viz-canvas-holder canvas{ display:block; width:100%; height:100%; }
  .viz-hint{ position:absolute; bottom:6px; left:0; right:0; text-align:center; font-size:.68rem; color:rgba(255,255,255,.45); letter-spacing:.4px; pointer-events:none; }
  .viz-label{ position:absolute; top:8px; left:10px; right:10px; font-size:.72rem; font-weight:700; color:var(--accent-gold); text-shadow:0 0 6px rgba(0,0,0,.8); letter-spacing:.3px; pointer-events:none; z-index:5; }
  .viz-load-status{ position:absolute; bottom:24px; left:0; right:0; text-align:center; font-size:.65rem; color:rgba(255,215,0,.75); letter-spacing:.3px; pointer-events:none; padding:0 6px; }

  .viz-image-full{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; padding:10px; }
  .viz-image-thumb{ position:absolute; bottom:8px; right:8px; width:64px; height:64px; object-fit:cover; border-radius:8px; border:2px solid rgba(255,215,0,.55); box-shadow:0 2px 10px rgba(0,0,0,.6); z-index:6; background:#000; }
  .viz-trigger-badges{ position:absolute; top:8px; right:8px; display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; max-width:65%; z-index:6; }
  .trigger-badge{ font-size:.62rem; font-weight:800; letter-spacing:.3px; color:#03060d; background:linear-gradient(135deg,#ffd700,#ff9900); padding:2px 7px; border-radius:10px; box-shadow:0 0 8px rgba(255,215,0,.5); }

  .top-ly{ font-style:italic; color:#a5d6a7; text-align:center; font-size:clamp(.85rem,1.8vw,.95rem); line-height:1.45; margin:2px 0 10px 0; padding:0 4px; opacity:.95; }
  .card-label{ color:var(--text-purple); text-align:center; font-size:clamp(1.2rem,3vw,1.55rem); font-weight:700; line-height:1.3; margin:4px 0 6px 0; word-break:break-word; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; }
  .separator{ color:#b0bec5; font-weight:300; }
  .c4-inline-img{ height:1.5em; max-height:34px; width:auto; vertical-align:middle; border-radius:6px; background:rgba(255,255,255,.05); padding:2px; filter:drop-shadow(0 0 6px rgba(255,215,0,.45)); }

  .lesser-dan{ color:var(--text-peach-soft); text-align:center; font-weight:400; font-style:italic; font-size:clamp(.88rem,1.8vw,1.02rem); line-height:1.45; margin:10px 4px; padding:0 4px; opacity:.92; }
  .lesser-dan.trung-dan{ color:#b39ddb; }
  .lesser-dan.ket-dan{ color:#80cbc4; }
  .chu-header{ color:var(--text-gold-bright); text-align:center; font-weight:800; font-size:clamp(1.05rem,2.3vw,1.3rem); margin:14px 0 8px 0; letter-spacing:.3px; }
  .data-container{ display:flex; justify-content:space-between; gap:10px; margin:8px 0 14px 0; }
  .chu-col{ flex:1; color:#fff3d0; text-align:center; font-weight:700; font-size:clamp(.9rem,2vw,1.08rem); line-height:1.35; background:rgba(255,236,179,.08); padding:10px 8px; border-radius:10px; border:1.5px solid rgba(255,236,179,.22); box-shadow:0 2px 8px rgba(0,0,0,.2); word-break:break-word; }
  .chu-KD-bold{ color:var(--text-orange-bold); text-align:center; font-weight:800; font-size:clamp(1.05rem,2.3vw,1.28rem); line-height:1.35; margin:12px 0 8px 0; padding:8px 10px; background:rgba(255,171,145,.08); border-radius:8px; border:1px solid rgba(255,171,145,.22); word-break:break-word; }
  .KD-bold{ color:var(--text-light-green); text-align:center; font-weight:800; font-size:clamp(1.08rem,2.3vw,1.3rem); line-height:1.35; margin:10px 0 10px 0; padding:8px 10px; background:rgba(200,230,201,.08); border-radius:8px; border:1px solid rgba(200,230,201,.22); word-break:break-word; }
</style>

<body>

<button id="quickFilterBtn" onclick="restoreHeader()">⚙️ Bộ lọc PT.xxx & Tìm kiếm</button>

<header id="mainHeader">
  <div class="header-container">
    <div class="header-top">
      <span class="app-title">Pháp Tu Hoa Nghiêm</span>
      <div class="header-actions">
        <span class="sync-pill"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Đang kết nối…</span></span>
        <span class="counter-pill" id="counterPill">0 / 0</span>
        <button class="toggle-btn" id="toggleCollapseBtn" onclick="toggleControlsCollapse()" title="Ẩn/Hiện thanh tìm kiếm">▼</button>
      </div>
    </div>
    <div class="controls-grid" id="controlsGrid">
      <select id="ptSelect" class="custom-select" onchange="handleFilterSort()">
        <option value="">Đang tải danh sách PT.xxx...</option>
      </select>
      <input type="search" id="searchInput" class="search-box" placeholder="🔍 Tìm theo tên, chú, pháp bảo..." oninput="handleFilterSort()" />
    </div>
  </div>
</header>

<main id="app">
  <div id="overviewSection"></div>
  <div id="cardFeed">
    <div class="status-box" id="statusBox">
      <div class="spinner"></div>
      Đang kết nối dữ liệu Google Sheet...
    </div>
  </div>
</main>

<script>
/* =========================================================================
   CONFIGURATION
   ========================================================================= */
const SHEET_ID = '1Gvl7SNXhVSrKBJiPgt78T2opWckb5OO59S-q_4S6Y7w';
const TAB_NAME = 'WBSID';
const GVIZ_URL       = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(TAB_NAME)}`;
const GVIZ_JSONP_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleGvizData&sheet=${encodeURIComponent(TAB_NAME)}`;

// Tokens that request the whole-sequence "Column of Light Spiral" overview
// panel to appear above the card feed for the currently filtered PT.xxx list.
const WHOLE_SEQUENCE_SPIRAL_TOKENS = ['SPIRAL_ALL','COLUMN_ALL','SPIRAL_SEQUENCE','COLUMN_OF_LIGHT_ALL'];
// Distinct internal key for whole-sequence tokens, kept separate from the
// per-card 'COLUMN_OF_LIGHT' animation key so triggering one never
// implicitly triggers the other.
const COLUMN_OF_LIGHT_WHOLE_SEQUENCE_KEY = 'COLUMN_OF_LIGHT_WHOLE_SEQUENCE';

let allRows = [];
let filterOptions = [];
let colHeaders = [];

/* ================= HEADER AUTO-HIDE ON SCROLL ================= */
let lastScrollY = window.scrollY;
const headerEl = document.getElementById('mainHeader');
const quickBtn = document.getElementById('quickFilterBtn');
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if (y > 80) {
    if (y > lastScrollY + 6) { headerEl.classList.add('header-hidden'); quickBtn.style.display = 'block'; }
    else if (y < lastScrollY - 6) { headerEl.classList.remove('header-hidden'); quickBtn.style.display = 'none'; }
  } else { headerEl.classList.remove('header-hidden'); quickBtn.style.display = 'none'; }
  lastScrollY = y;
}, { passive:true });
function restoreHeader(){ headerEl.classList.remove('header-hidden'); quickBtn.style.display='none'; window.scrollTo({top:0,behavior:'smooth'}); }
function toggleControlsCollapse(){
  const grid = document.getElementById('controlsGrid');
  const btn = document.getElementById('toggleCollapseBtn');
  if (grid.classList.contains('collapsed')) { grid.classList.remove('collapsed'); btn.textContent='▼'; }
  else { grid.classList.add('collapsed'); btn.textContent='▲'; }
}

/* ================= GENERAL HELPERS ================= */
function cleanText(v){
  if (v===undefined || v===null) return '';
  const s = String(v).trim();
  if (s==='' || s==='0' || s.toLowerCase()==='null' || s.toLowerCase()==='undefined') return '';
  return s;
}
function findValue(row, pattern){
  for (const [k,v] of Object.entries(row)) { if (pattern.test(k)) { const c = cleanText(v); if (c) return c; } }
  return '';
}
function findExact(row, pattern){
  for (const [k,v] of Object.entries(row)) { if (pattern.test(k.trim())) { const c = cleanText(v); if (c) return c; } }
  return '';
}
function naturalCompare(a,b){ return String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:'base'}); }

function getDriveDirectImageUrl(urlOrId){
  if (!urlOrId) return '';
  const str = String(urlOrId).trim();
  if (!str || str.startsWith('#') || str.length<5) return '';
  if (/^[a-zA-Z0-9_-]{25,}$/.test(str)) return `https://drive.google.com/thumbnail?id=${str}&sz=w800`;
  const idMatch = str.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || str.match(/id=([a-zA-Z0-9_-]+)/) ||
                  str.match(/\/open\?id=([a-zA-Z0-9_-]+)/) || str.match(/\/uc\?id=([a-zA-Z0-9_-]+)/);
  if (idMatch) return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w800`;
  if (str.startsWith('http://') || str.startsWith('https://')) return str;
  return '';
}

/* Robust "x,y,z" coordinate parser */
function parseCoordinates(coordStr){
  if (!coordStr) return null;
  let cleaned = String(coordStr)
    .replace(/[\u2212\u2010\u2011\u2012\u2013\u2014\u2015\uFE63\uFF0D]/g,'-')
    .replace(/[()[\]{}'"]/g,'').trim();
  if (cleaned.includes(';')) {
    const nums = cleaned.split(';').map(p => { const m=p.replace(',', '.').match(/-?\d+(?:\.\d+)?/); return m?parseFloat(m[0]):null; }).filter(n=>n!==null);
    if (nums.length>=3) return nums.slice(0,3);
  }
  if (cleaned.includes('.')) {
    const m = cleaned.match(/-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/gi);
    if (m && m.length>=3) return [parseFloat(m[0]),parseFloat(m[1]),parseFloat(m[2])];
  }
  const decFixed = cleaned.replace(/(\d),(\d)/g,'$1.$2');
  const decM = decFixed.match(/-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/gi);
  if (decM && decM.length>=3) return [parseFloat(decM[0]),parseFloat(decM[1]),parseFloat(decM[2])];
  const intM = cleaned.match(/-?\d+/g);
  if (intM && intM.length>=3) return [parseFloat(intM[0]),parseFloat(intM[1]),parseFloat(intM[2])];
  return null;
}

/* -------------------------------------------------------------------------
   VISUALIZATION CELL PARSER
   The "Visualization" column can contain, in any combination:
     - A Google Drive / http image link  -> displayed directly as an image
     - One or more +TRIGGER tokens (+EGO, +LASER, +HELIX/+SPIRAL,
       +TORUS_IN, +TORUS_OUT, +COLUMN_OF_LIGHT, or any brand-new +xxx)
       -> loads the shared Buddha 3D model and plays the matching animation
     - An "x, y, z" coordinate -> places a small glowing dharma-object marker
     - A #hexcolor -> tints the marker / animation for this row
     - One of WHOLE_SEQUENCE_SPIRAL_TOKENS -> flags the ENTIRE filtered
       PT.xxx sequence to show the combined Column of Light Spiral overview
   ------------------------------------------------------------------------- */
// Fallback image shown whenever a row's Visualization cell is blank.
const DEFAULT_VISUALIZATION_IMAGE_URL = getDriveDirectImageUrl('https://drive.google.com/file/d/1C9OUE95LNiVz0fq7L8JgiebQVMgEZzGl/view?usp=drive_link');

function parseVisualizationCell(raw){
  const text = cleanText(raw);
  if (!text) return { raw:'', imageUrl: DEFAULT_VISUALIZATION_IMAGE_URL, triggers:[], coords:null, colorHex:'' };
  let working = text;

  const urlMatch = working.match(/https?:\/\/\S+/i);
  const url = urlMatch ? urlMatch[0].replace(/[)\],;]+$/,'') : '';
  if (url) working = working.replace(url, ' ');

  const triggers = [...working.matchAll(/\+([A-Za-z][A-Za-z0-9_]*)/g)].map(m => m[1].toUpperCase());
  working = working.replace(/\+[A-Za-z][A-Za-z0-9_]*/g, ' ');

  const colorMatch = working.match(/#(?:[0-9a-f]{3}|[0-9a-f]{6})\b/i);
  const colorHex = colorMatch ? colorMatch[0] : '';
  if (colorHex) working = working.replace(colorHex, ' ');

  const numCount = (working.match(/-?\d+(?:[.,]\d+)?/g) || []).length;
  const coords = numCount >= 3 ? parseCoordinates(working) : null;

  const imageUrl = url ? getDriveDirectImageUrl(url) : '';

  return { raw:text, imageUrl, triggers, coords, colorHex };
}

/* Normalize alias trigger names to a single canonical animation key */
function normalizeTriggerName(name){
  const n = name.toUpperCase();
  if (n === 'BUBBLE') return 'EGO';
  if (n === 'HELIX' || n === 'XOAN_OC') return 'SPIRAL';
  if (n === 'TORUSIN' || n === 'NOI_TRIET') return 'TORUS_IN';
  if (n === 'TORUSOUT' || n === 'BIEN_CHIEU') return 'TORUS_OUT';
  // Whole-sequence tokens resolve to their OWN key -- they only ever flag
  // the overview panel, never the per-card animation.
  if (WHOLE_SEQUENCE_SPIRAL_TOKENS.includes(n)) return COLUMN_OF_LIGHT_WHOLE_SEQUENCE_KEY;
  // Per-card individual Column of Light trigger aliases.
  if (n === 'COLUMN' || n === 'LA_SPIRAL' || n === 'COT_ANH_SANG' || n === 'COLUMN_OF_LIGHT') return 'COLUMN_OF_LIGHT';
  // YA -> water drop -> SA -> 4-directional lotus growth -> spiral merge -> VA sequence.
  if (n === 'LOTUS' || n === 'LOTUS_SEQUENCE' || n === 'FOUR_LOTUS' || n === 'SEN' || n === 'SEN_BON_MAU') return 'LOTUS_SEQUENCE';
  return n;
}

// Friendly Vietnamese display names for trigger badges / status text.
// Falls back to the raw "+TOKEN" form for any trigger not listed here.
const TRIGGER_DISPLAY_NAMES = {
  LOTUS_SEQUENCE: 'Liên Hoa Bồ Đề Tâm'
};
function triggerDisplayLabel(t){
  return TRIGGER_DISPLAY_NAMES[t] ? TRIGGER_DISPLAY_NAMES[t] : ('+' + t);
}

/* =========================================================================
   1. GOOGLE SHEET INGESTION
   ========================================================================= */
function setSync(label, color){
  document.getElementById('syncLabel').textContent = label;
  document.getElementById('syncDot').style.background = color;
  document.getElementById('syncDot').style.boxShadow = `0 0 8px ${color}`;
}

async function initSheetData(){
  try {
    const res = await fetch(GVIZ_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}')+1);
    const json = JSON.parse(jsonStr);
    onGvizLoaded(json);
  } catch (err) {
    setSync('Đang thử kết nối JSONP…', '#ffd700');
    window.handleGvizData = function(json){ onGvizLoaded(json); };
    const script = document.createElement('script');
    script.src = GVIZ_JSONP_URL;
    script.onerror = function(){
      setSync('Không thể kết nối', '#ef5350');
      document.getElementById('statusBox').innerHTML = `
        <p style="color:#ef5350; font-weight:700;">Không thể tải dữ liệu từ Google Sheet</p>
        <p style="font-size:.85rem; margin-top:8px;">Vui lòng kiểm tra quyền chia sẻ công khai của file (Anyone with the link — Viewer).</p>`;
    };
    document.head.appendChild(script);
  }
}

function onGvizLoaded(json){
  if (!json || !json.table || !json.table.rows) { setSync('Không có dữ liệu', '#ef5350'); return; }
  let headers = (json.table.cols || []).map(c => (c && c.label) ? c.label.trim() : '');
  let startRow = 0;
  if (json.table.rows.length > 0) {
    const row0 = json.table.rows[0].c || [];
    const candidateLabels = row0.map(c => (c && (c.f || c.v)) ? String(c.f || c.v).trim() : '');
    if (candidateLabels.some(l => /WBSID|PT\.|Thủ Nhãn|STT/i.test(l))) { headers = candidateLabels; startRow = 1; }
  }
  headers = headers.map((h,i) => h || `COL_${i}`);
  colHeaders = headers;

  allRows = [];
  for (let r = startRow; r < json.table.rows.length; r++) {
    const rowObj = {};
    const cells = json.table.rows[r].c || [];
    cells.forEach((cell, idx) => {
      const h = headers[idx] || `COL_${idx}`;
      const val = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== null && cell.v !== undefined ? cell.v : '')) : '';
      rowObj[h] = val;
      rowObj[`idx_${idx}`] = val;
    });
    const check = findValue(rowObj, /Thủ Nhãn|WBSID|PT\./i) || rowObj['idx_0'] || rowObj['idx_1'];
    if (cleanText(check)) allRows.push(rowObj);
  }

  discoverPTFilters(headers);
  buildDropdown();
  handleFilterSort();
  setSync('Đã đồng bộ Google Sheet', '#00ff88');
}

function discoverPTFilters(headersList){
  filterOptions = [];
  const seen = new Set();
  headersList.forEach((h) => {
    const headerName = (h||'').trim();
    if (/^PT\./i.test(headerName) && !seen.has(headerName)) {
      const validRows = allRows.filter(r => cleanText(r[headerName]) !== '');
      if (validRows.length > 0) { seen.add(headerName); filterOptions.push({ key: headerName, label: headerName, count: validRows.length }); }
    }
  });
}

function buildDropdown(){
  const select = document.getElementById('ptSelect');
  select.innerHTML = '';
  if (filterOptions.length === 0) { select.innerHTML = '<option value="">Không tìm thấy cột PT.xxx</option>'; return; }
  filterOptions.forEach(opt => {
    const el = document.createElement('option');
    el.value = opt.key;
    el.textContent = `🎯 ${opt.label} (${opt.count} thẻ)`;
    select.appendChild(el);
  });
  select.value = filterOptions[0].key;
}

   2. FIELD EXTRACTION PER ROW
   ========================================================================= */
function extractRowFields(row){
  const wbsid = findValue(row, /^WBSID$/i) || row['idx_0'] || '';
  const a1Su  = findExact(row, /^A1[\s.:\-]*Sự/i) || findValue(row, /Sự/i);
  const a2Ly  = findExact(row, /^A2[\s.:\-]*Lý/i) || findValue(row, /A2/i);
  const a3KhaiDan = findExact(row, /^A3[\s.:\-]*Khai\s*Dẫn/i);
  const a4Hanh  = findExact(row, /^A4[\s.:\-]*Hành\s*$/i);
  const a4HanhA = findExact(row, /^A4[\s.:\-]*Hành\s*A\s*$/i) || findValue(row, /Hành\s*A/i);
  const a4HanhB = findExact(row, /^A4[\s.:\-]*Hành\s*B\s*$/i) || findValue(row, /Hành\s*B/i);
  const a5TrungDan = findExact(row, /^A5[\s.:\-]*Trung\s*Dẫn/i);
  const a6ChuKD = findExact(row, /^A6[\s.:\-]*Chú\s*Khởi\s*Động/i);
  const a8LoiKD = findExact(row, /^A8[\s.:\-]*Lời\s*Khẳng\s*Định/i);
  const a9KetDan = findExact(row, /^A9[\s.:\-]*Kết\s*Dẫn/i);

  const c5Name = findValue(row, /C5.*Thủ\s*Nhãn.*Tên/i) || findValue(row, /C5.*Tên/i) || findValue(row, /Thủ\s*Nhãn.*Tên/i);
  const c1Ten  = findValue(row, /C1.*Tên/i) || findExact(row, /^C1\b/i);
  const c4RawImg = findValue(row, /C4.*Link/i) || findValue(row, /C4.*Image/i) || findExact(row, /^C4\b/i);
  const c4Img = getDriveDirectImageUrl(c4RawImg);

  const vizRaw = findExact(row, /^Visualization\b/i) || findValue(row, /Visualization/i);

  return {
    wbsid, a1Su, a2Ly, a3KhaiDan, a4Hanh, a4HanhA, a4HanhB, a5TrungDan, a6ChuKD, a8LoiKD, a9KetDan,

  };
}

/* =========================================================================
   4. SHARED CONSTANTS — faithfully ported from the original Lotus
      Bodhicitta System (Buddha coordinate convention: Crown = Z 1.0,
      Lotus Seat = Z -0.5, Heart/center ≈ Z 0.25; anatomical Front = +Y,
      anatomical Right hand side = +X).
   ========================================================================= */
const AXES_DIRECTIONS = [
  { dir: () => new THREE.Vector3(1,0,0),  col: 0xff4444 },
  { dir: () => new THREE.Vector3(-1,0,0), col: 0xff4444 },
  { dir: () => new THREE.Vector3(0,1,0),  col: 0x00ff88 },
  { dir: () => new THREE.Vector3(0,-1,0), col: 0x00ff88 },
  { dir: () => new THREE.Vector3(0,0,1),  col: 0x00e5ff },
  { dir: () => new THREE.Vector3(0,0,-1), col: 0x00e5ff }
];

// Always-on coordinate axis labels (+X / -X / +Y / -Y / +Z / -Z), so it's
// unambiguous which direction is which while orbiting the scene. Colors
// match the existing +LASER / +SPIRAL trigger convention: X=red, Y=green,
// Z=cyan. Sprites always face the camera automatically (THREE.Sprite).
function makeAxisLabelSprite(text, hexColor){
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillStyle = hexColor; ctx.shadowColor = hexColor; ctx.shadowBlur = 6;
  ctx.fillText(text, 64, 32);
  ctx.shadowBlur = 0;
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  return sprite;
}

const AXIS_LABEL_SPECS = [
  { text: '+X', dir: [1,0,0],  colorHex: '#ff6666' },
  { text: '-X', dir: [-1,0,0], colorHex: '#ff6666' },
  { text: '+Y', dir: [0,1,0],  colorHex: '#66ff99' },
  { text: '-Y', dir: [0,-1,0], colorHex: '#66ff99' },
  { text: '+Z', dir: [0,0,1],  colorHex: '#66ccff' },
  { text: '-Z', dir: [0,0,-1], colorHex: '#66ccff' }
];

function buildAxisLabelsGroup(radius, spriteScale){
  radius = radius || 1.6;
  spriteScale = spriteScale || 0.42;
  const group = new THREE.Group();
  group.renderOrder = 50;

  AXIS_LABEL_SPECS.forEach(spec => {
    const color = new THREE.Color(spec.colorHex);
    const lineMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.55 });
    const lineGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0,0,0),
      new THREE.Vector3(spec.dir[0]*radius, spec.dir[1]*radius, spec.dir[2]*radius)
    ]);
    group.add(new THREE.Line(lineGeo, lineMat));

    const sprite = makeAxisLabelSprite(spec.text, spec.colorHex);
    sprite.position.set(spec.dir[0]*radius*1.08, spec.dir[1]*radius*1.08, spec.dir[2]*radius*1.08);
    sprite.scale.set(spriteScale, spriteScale*0.5, 1);
    group.add(sprite);
  });

  return group;
}

// Column of Light spiral: exact same calibrated geometry as the source system —
// counter-clockwise turns starting on +Y, 4 nodes per 0.25 unit height,
// linear expanding radius from 1.35 (seat) up to 2.20 (crown+).
function getSpiralPosition(i){
  const t = i;
  const theta = 0 + t * (Math.PI/2); // start on +X axis instead of +Y
  const z = -0.50 + t * 0.0625;
  const r = 1.35 + (z + 0.50) * 0.34;
  return new THREE.Vector3(r*Math.cos(theta), r*Math.sin(theta), z);
}
const COLUMN_OF_LIGHT_NODE_COUNT = 40;

// Faithful port of the Column of Light "wall" ribbon geometry from the
// original Lotus Bodhicitta System (rebuildWallGeometry). Builds a
// triangulated glowing ribbon surface between the spiral curve and the
// curve exactly one full turn (4 nodes) below it -- or, for the first turn,
// down to the flat base circle at R=1.35, Z=-0.50. This tapers naturally
// from zero height at t=0 up to the full turn height with no blunt ends --
// producing a rising spiral WALL of light (matches reference visuals),
// not merely a traveling line or dots.
function buildColumnOfLightWallGeometry(maxT, segmentsPerNode){
  segmentsPerNode = segmentsPerNode || 20;
  const vertices = [], indices = [];
  const totalSegments = Math.max(0, Math.round(maxT * segmentsPerNode));

  for (let j = 1; j <= totalSegments; j++) {
    const tPrev = (j - 1) / segmentsPerNode;
    const tCurr = j / segmentsPerNode;
    const pPrev = getSpiralPosition(tPrev);
    const pCurr = getSpiralPosition(tCurr);

    let bPrevX, bPrevY, bPrevZ;
    if (tPrev >= 4) {
      const p = getSpiralPosition(tPrev - 4);
      bPrevX = p.x; bPrevY = p.y; bPrevZ = p.z;
    } else {
      const thetaPrev = 0 + tPrev * (Math.PI / 2); // start on +X axis
      const rBase = 1.35;
      bPrevX = rBase * Math.cos(thetaPrev);
      bPrevY = rBase * Math.sin(thetaPrev);
      bPrevZ = -0.50;
    }

    let bCurrX, bCurrY, bCurrZ;
    if (tCurr >= 4) {
      const p = getSpiralPosition(tCurr - 4);
      bCurrX = p.x; bCurrY = p.y; bCurrZ = p.z;
    } else {
      const thetaCurr = 0 + tCurr * (Math.PI / 2); // start on +X axis
      const rBase = 1.35;
      bCurrX = rBase * Math.cos(thetaCurr);
      bCurrY = rBase * Math.sin(thetaCurr);
      bCurrZ = -0.50;
    }

    const baseIndex = vertices.length / 3;
    vertices.push(
      pPrev.x, pPrev.y, pPrev.z,
      pCurr.x, pCurr.y, pCurr.z,
      bPrevX, bPrevY, bPrevZ,
      bCurrX, bCurrY, bCurrZ
    );
    indices.push(
      baseIndex + 0, baseIndex + 2, baseIndex + 1,
      baseIndex + 1, baseIndex + 2, baseIndex + 3
    );
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
  geo.setIndex(indices);
  if (totalSegments > 0) geo.computeVertexNormals();
  return geo;
}

// Same glowing additive "wall" material used by the original system.
function makeColumnOfLightWallMaterial(colorOverride){
  return new THREE.MeshBasicMaterial({
    color: colorOverride ? new THREE.Color(colorOverride) : new THREE.Color(0xffe240),
    transparent: true, opacity: 0.45, side: THREE.DoubleSide,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
}


// True circular Horn Torus evaluator (Torus In stays inside the R=2.1 Bubble
// of Ego; Torus Out erupts higher/wider than the bubble) — same math as source.
function evaluateHornTorusPoint(tau, azimuth, direction){
  const Z_c = 0.25, H = 0.75, R_core = 0.04;
  let r, z;
  if (direction === 'in') {
    const R_max = 1.65;
    const R_0 = (R_max*R_max - H*H) / (2.0*R_max);
    const r_circ = R_max - R_0;
    const alpha_top = Math.PI - Math.asin(H / r_circ);
    if (tau < 0.35) { const s = tau/0.35; z = 1.0 - s*1.5; r = R_core; }
    else { const s = (tau-0.35)/0.65; const alpha = -alpha_top + s*(2.0*alpha_top);
      r = Math.max(R_core, R_0 + r_circ*Math.cos(alpha)); z = Z_c + r_circ*Math.sin(alpha); }
  } else {
    const r_circ = 2.05;
    const R_0 = Math.sqrt(r_circ*r_circ - H*H);
    const alpha_top = Math.PI - Math.asin(H / r_circ);
    if (tau < 0.35) { const s = tau/0.35; z = -0.5 + s*1.5; r = R_core; }
    else { const s = (tau-0.35)/0.65; const alpha = alpha_top - s*(2.0*alpha_top);
      r = Math.max(R_core, R_0 + r_circ*Math.cos(alpha)); z = Z_c + r_circ*Math.sin(alpha); }
  }
  return { x: r*Math.cos(azimuth), y: r*Math.sin(azimuth), z };
}

function createOuterBubbleGeometry(phiLength, widthSegs, heightSegs){
  const geo = new THREE.SphereGeometry(2.1, widthSegs, heightSegs, 0, phiLength);
  geo.rotateX(Math.PI/2); geo.rotateZ(-Math.PI/2);
  return geo;
}

/* =========================================================================
   5. SHARED BUDDHA MODEL LOADER
      Full anatomical axis convention used throughout this file:
        - Crown (top of head)      -> scene +Z  (Lotus Seat/base -> Z = -0.5)
        - Anatomical FRONT (face)  -> scene +Y
        - Anatomical RIGHT HAND    -> scene +X
      Note on handedness: in a standard right-handed coordinate system (which
      THREE.js uses), a normal, non-mirrored standing figure can only ever
      satisfy TWO of "front=+Y" / "right=+X" / "up=+Z" independently before
      the third is fixed by the anatomy itself (right x up = front). Crown=+Z
      is treated as the load-bearing axis (every animation's math depends on
      it), and FRONT=+Y is prioritized next (it determines how the statue
      visually presents to the camera). As a consequence the anatomical
      right hand renders on the -X side rather than +X for a true
      non-mirrored figure -- flip BUDDHA_EXTRA_ROTATION_Z below by +/- PI if
      you'd rather prioritize RIGHT=+X instead (front will then land on -Y).
      A +X offset is also applied to shift the figure slightly along the
      +X axis rather than sitting dead-center.
   ========================================================================= */
const sharedGLTFLoader = ('THREE' in window && THREE.GLTFLoader) ? new THREE.GLTFLoader() : null;

const BUDDHA_LOCAL_FILENAME = 'glass+buddha+statue+3d+model.glb';
// Google Drive fallback links removed per request — the Buddha model now
// loads exclusively from the local file above (served alongside index.html).
const BUDDHA_MODEL_CANDIDATES = [
  BUDDHA_LOCAL_FILENAME
];
const BUDDHA_SEAT_Z  = -0.5;   // Lotus Seat, base of the statue
const BUDDHA_CROWN_Z = 1.0;    // Crown, top of the statue
const BUDDHA_TARGET_HEIGHT = BUDDHA_CROWN_Z - BUDDHA_SEAT_Z; // 1.5 units, matches all trigger math
const BUDDHA_EXTRA_ROTATION_X = Math.PI/2; // most GLB exports are Y-up; this scene is Z-up
const BUDDHA_EXTRA_ROTATION_Z = Math.PI/2; // yaw about the crown axis so the model's anatomical
                                            // FRONT faces scene +Y. (Was Math.PI, which placed the
                                            // front on -X; rotating back by a quarter-turn to
                                            // Math.PI/2 moves it from -X to +Y as requested.)
                                            // If the front ever looks off after a model swap, try
                                            // 0 or -Math.PI/2 as the other two cardinal options.
const BUDDHA_X_OFFSET = 0.0;   // Net offset along X: was -0.1, nudged an additional +0.1 along +X
                                // to align the (0,0,0) origin with the statue's anatomical
                                // solar plexus.
const BUDDHA_Y_OFFSET = 0.2;   // Net offset along Y: was 0.1, nudged an additional +0.1 along +Y

let buddhaModelLoadPromise = null;
function loadSharedBuddhaModel(){
  if (buddhaModelLoadPromise) return buddhaModelLoadPromise;
  if (!sharedGLTFLoader) { buddhaModelLoadPromise = Promise.reject(new Error('GLTFLoader unavailable')); return buddhaModelLoadPromise; }
  const tryIndex = (idx) => {
    if (idx >= BUDDHA_MODEL_CANDIDATES.length) return Promise.reject(new Error('All Buddha model sources failed to load'));
    const url = BUDDHA_MODEL_CANDIDATES[idx];
    return new Promise((resolve, reject) => {
      sharedGLTFLoader.load(url, (gltf) => resolve(gltf.scene), undefined,
        (err) => { console.warn(`Buddha model source failed: ${url}`, err); reject(err); });
    }).catch(() => tryIndex(idx + 1));
  };
  buddhaModelLoadPromise = tryIndex(0);
  return buddhaModelLoadPromise;
}

// Auto-fit: rescale to exactly BUDDHA_TARGET_HEIGHT, then reposition so the
// base sits precisely at BUDDHA_SEAT_Z and the figure is shifted by
// BUDDHA_X_OFFSET along +X and BUDDHA_Y_OFFSET along +Y — keeping every animation (bubble, torus, laser,
// spiral, column of light) correctly aligned regardless of the GLB's
// native scale/pivot.
function fitBuddhaModelToScene(object3D){
  // Order 'ZXY' with a zero Y-component makes the composed rotation apply
  // X (pitch: fixes CROWN to scene +Z) first, then Z (yaw: fixes FRONT to
  // scene +Y) second -- see the anatomical axis convention notes above.
  object3D.rotation.order = 'ZXY';
  object3D.rotation.set(BUDDHA_EXTRA_ROTATION_X, 0, BUDDHA_EXTRA_ROTATION_Z);
  object3D.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(object3D);
  let size = new THREE.Vector3(); box.getSize(size);
  const verticalExtent = size.z || size.y || 1;
  const scale = BUDDHA_TARGET_HEIGHT / (verticalExtent || 1);
  object3D.scale.setScalar(scale);
  object3D.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(object3D);
  const center = new THREE.Vector3(); box.getCenter(center);
  object3D.position.x -= center.x;
  object3D.position.x += BUDDHA_X_OFFSET;
  object3D.position.y -= center.y;
  object3D.position.y += BUDDHA_Y_OFFSET;
  object3D.position.z -= box.min.z;
  object3D.position.z += BUDDHA_SEAT_Z;
}

function makeCrystalMaterial(){
  return new THREE.MeshPhysicalMaterial({
    color: 0x80d8ff, emissive: 0x002b4d, emissiveIntensity: 0.2,
    roughness: 0.16, metalness: 0.08, transmission: 0.94, opacity: 0.28, transparent: true,
    depthWrite: false, side: THREE.FrontSide
  });
}

// Applied to every loaded GLB Buddha instance (per-card AND overview) so the
// YA/SA/VA Siddham glyphs and the traveling water drop of +LOTUS_SEQUENCE
// stay clearly visible through the body, regardless of whatever opacity the
// source .glb materials were originally authored with.
const BUDDHA_BODY_OPACITY = 0.28;
function applyBuddhaTransparency(object3D){
  object3D.traverse((obj) => {
    if (!obj.isMesh || !obj.material) return;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    mats.forEach((m) => {
      m.transparent = true;
      m.opacity = BUDDHA_BODY_OPACITY;
      m.depthWrite = false;
      if ('transmission' in m) m.transmission = Math.max(m.transmission || 0, 0.9);
      m.side = THREE.DoubleSide;
      m.needsUpdate = true;
    });
  });
}

// Procedural placeholder statue (axially symmetric -- no anatomical
// front/back or left/right of its own), positioned on the SAME
// Crown=1.0 / Seat=-0.5
// coordinate convention as the GLB fit (also shifted by BUDDHA_X_OFFSET
// along +X and BUDDHA_Y_OFFSET along +Y), so triggers line up identically whichever Buddha
// representation is currently active.
function buildBuddhaStatue(sharedMat){
  const group = new THREE.Group();
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 32, 32), sharedMat);
  head.position.set(0, 0, 0.45); group.add(head);
  const usnisa = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), sharedMat);
  usnisa.position.set(0, 0, 0.72); group.add(usnisa);
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.28, 0.55, 32), sharedMat);
  torso.rotation.x = Math.PI / 2; torso.position.set(0, 0, 0.08); group.add(torso);
  const legs = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.13, 16, 64), sharedMat);
  legs.position.set(0, 0, -0.28); group.add(legs);
  group.position.x += BUDDHA_X_OFFSET;
  group.position.y += BUDDHA_Y_OFFSET;
  return group;
}

/* =========================================================================
   6. TRIGGER ANIMATION LIBRARY (per-card, lightweight ports of the full
      Lotus Bodhicitta System animations). Any recognized +XXX token below
      maps to a faithful animation; any brand-new, unrecognized +xxx token
      still loads the Buddha model and gets a generic glowing pulse + label
      so nothing entered in the sheet is ever silently ignored.
   ========================================================================= */

// +EGO / +BUBBLE — clear crystal Bubble of Ego around the Buddha (radius 2.1).
// Standalone use (no opts) breathes open/close continuously, as before.
// Pass { holdOpen: true } (used by +LOTUS_SEQUENCE) to have it form ONCE —
// smoothly sweeping shut from 0 to fully open over EGO_FORM_DURATION_SECONDS
// — and then remain fully open and static for the rest of the sequence,
// only disappearing when the card/animation is reset (disposed).
const EGO_FORM_DURATION_SECONDS = 1.2;
function buildEgoAnimation(root, opts){
  const holdOpen = !!(opts && opts.holdOpen);
  const mat = new THREE.MeshPhysicalMaterial({ color:0xffffff, roughness:0.05, metalness:0.1, transmission:0.98, ior:1.52, thickness:0.3, transparent:true, opacity:1.0, side:THREE.DoubleSide, depthWrite:false });
  let geo = createOuterBubbleGeometry(0.001, 40, 28);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 3;
  root.add(mesh);
  let fullyFormed = false;
  return {
    extent: 2.1,
    update(t){
      if (holdOpen && fullyFormed) return; // already fully open & static — stop rebuilding geometry every frame
      let phi;
      if (holdOpen) {
        const p = Math.min(1, t / EGO_FORM_DURATION_SECONDS);
        const eased = p*p*(3-2*p); // smoothstep ease
        phi = Math.max(0.01, eased * Math.PI * 2);
        if (p >= 1) fullyFormed = true;
      } else {
        const u = (Math.sin(t*0.5)*0.5+0.5); // continuous open/close breathing sweep
        phi = Math.max(0.01, u*Math.PI*2);
      }
      mesh.geometry.dispose();
      mesh.geometry = createOuterBubbleGeometry(phi, 40, 28);
    },
    dispose(){ root.remove(mesh); mesh.geometry.dispose(); mat.dispose(); }
  };
}

// +LASER — 6 cardinal axial beams of light shooting outward from origin (length 2.4)
function buildLaserAnimation(root, colorOverride){
  const beams = AXES_DIRECTIONS.map(axis => {
    const color = colorOverride ? new THREE.Color(colorOverride) : new THREE.Color(axis.col);
    const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, side:THREE.DoubleSide });
    const g = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,1,14), mat); shaft.position.y = 0.5; g.add(shaft);
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.034,0.14,14), mat); head.position.y = 1.07; g.add(head);
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), axis.dir());
    root.add(g);
    return { g, shaft, head, mat };
  });
  return {
    extent: 2.4,
    update(t){
      const p = (t*0.55) % 1.5; const prog = Math.min(1, p);
      const len = Math.max(0.02, prog * 2.4);
      beams.forEach(b => { b.shaft.scale.y = len; b.shaft.position.y = len/2; b.head.position.y = len+0.07; b.head.visible = prog>0.02; b.mat.opacity = 0.9*Math.min(1,prog*4); });
    },
    dispose(){ beams.forEach(b => root.remove(b.g)); }
  };
}

// +HELIX / +SPIRAL — 6 expanding conical helical beams from the origin (10.5 tight turns)
function buildSpiralAnimation(root, colorOverride){
  const spiralLength = 2.4, maxR = 0.22, turns = 10.5, N = 140;
  const items = AXES_DIRECTIONS.map(axis => {
    const d = axis.dir().normalize();
    const ref = Math.abs(d.z) < 0.9 ? new THREE.Vector3(0,0,1) : new THREE.Vector3(0,1,0);
    const v1 = new THREE.Vector3().crossVectors(d, ref).normalize();
    const v2 = new THREE.Vector3().crossVectors(d, v1).normalize();
    const positions = new Float32Array(N*3);
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(positions,3)); geo.setDrawRange(0,0);
    const color = colorOverride ? new THREE.Color(colorOverride) : new THREE.Color(axis.col);
    const mat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending });
    const line = new THREE.Line(geo, mat); root.add(line);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.035,12,12), new THREE.MeshBasicMaterial({ color:0xffffff }));
    root.add(tip);
    return { d, v1, v2, geo, positions, mat, line, tip };
  });
  return {
    extent: spiralLength,
    update(t){
      const p = (t*0.42) % 1.6; const prog = Math.min(1, p);
      const currentL = prog*spiralLength;
      const activePts = Math.max(2, Math.round(prog*N));
      items.forEach(item => {
        let ptr = 0, lastX=0,lastY=0,lastZ=0;
        for (let j=0;j<N;j++){
          const s = (j/(N-1))*currentL;
          const r = maxR*Math.pow(s/spiralLength, 0.85);
          const theta = (s/spiralLength)*Math.PI*2*turns;
          const x = s*item.d.x + r*(Math.cos(theta)*item.v1.x + Math.sin(theta)*item.v2.x);
          const y = s*item.d.y + r*(Math.cos(theta)*item.v1.y + Math.sin(theta)*item.v2.y);
          const z = s*item.d.z + r*(Math.cos(theta)*item.v1.z + Math.sin(theta)*item.v2.z);
          item.positions[ptr++]=x; item.positions[ptr++]=y; item.positions[ptr++]=z;
          if (j===activePts-1){ lastX=x; lastY=y; lastZ=z; }
        }
        item.geo.setDrawRange(0, activePts);
        item.geo.attributes.position.needsUpdate = true;
        item.tip.position.set(lastX,lastY,lastZ);
        item.tip.visible = prog>0.02;
        item.mat.opacity = 0.95*Math.min(1, prog*3.5);
      });
    },
    dispose(){ items.forEach(it => { root.remove(it.line); root.remove(it.tip); it.geo.dispose(); it.mat.dispose(); }); }
  };
}

// +TORUS_IN / +TORUS_OUT — circular Horn Torus energy flow (streamlines + particles)
function buildTorusAnimation(root, direction, colorOverride){
  const colorHex = colorOverride ? new THREE.Color(colorOverride).getHex() : (direction==='in' ? 0x00ffaa : 0xff9900);
  const colorStr = '#' + colorHex.toString(16).padStart(6,'0');
  const numStreamlines = 10, segsPerStreamline = 40, particlesPerStreamline = 3;
  const totalParticles = numStreamlines*particlesPerStreamline;

  const lineMat = new THREE.LineBasicMaterial({ color:colorHex, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending });
  const streamlines = [];
  for (let i=0;i<numStreamlines;i++){
    const azimuth = (i/numStreamlines)*Math.PI*2;
    const positions = new Float32Array(segsPerStreamline*3);
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const line = new THREE.Line(geo, lineMat); root.add(line);
    streamlines.push({ line, geo, positions, azimuth });
  }
  function glowTex(hex){
    const c = document.createElement('canvas'); c.width=64; c.height=64;
    const ctx = c.getContext('2d'); const g = ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'#ffffff'); g.addColorStop(0.25,hex); g.addColorStop(0.65,hex+'88'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }
  const particlePositions = new Float32Array(totalParticles*3);
  const particleGeo = new THREE.BufferGeometry(); particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions,3));
  const particleMat = new THREE.PointsMaterial({ map: glowTex(colorStr), size: direction==='in'?0.11:0.14, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false });
  const particles = new THREE.Points(particleGeo, particleMat);
  root.add(particles);

  return {
    extent: direction==='in' ? 1.7 : 4.0,
    update(t){
      const flowOffset = (t*(direction==='in'?0.45:0.40)) % 1.0;
      const progress = 1.0;
      const maxPts = Math.max(2, Math.round(progress*segsPerStreamline));
      streamlines.forEach(item => {
        let ptr=0;
        for (let j=0;j<segsPerStreamline;j++){
          const baseTau = j/(segsPerStreamline-1);
          const pt = evaluateHornTorusPoint(baseTau, item.azimuth, direction);
          item.positions[ptr++]=pt.x; item.positions[ptr++]=pt.y; item.positions[ptr++]=pt.z;
        }
        item.geo.setDrawRange(0, maxPts); item.geo.attributes.position.needsUpdate = true;
      });
      let pPtr=0;
      for (let i=0;i<numStreamlines;i++){
        const azimuth = (i/numStreamlines)*Math.PI*2;
        for (let p=0;p<particlesPerStreamline;p++){
          const baseTau = p/particlesPerStreamline;
          const tau = (baseTau+flowOffset)%1.0;
          const pt = evaluateHornTorusPoint(tau, azimuth, direction);
          particlePositions[pPtr++]=pt.x; particlePositions[pPtr++]=pt.y; particlePositions[pPtr++]=pt.z;
        }
      }
      particleGeo.setDrawRange(0, totalParticles); particleGeo.attributes.position.needsUpdate = true;
    },
    dispose(){ streamlines.forEach(s=>{root.remove(s.line); s.geo.dispose();}); lineMat.dispose(); root.remove(particles); particleGeo.dispose(); particleMat.dispose(); }
  };
}

// +COLUMN_OF_LIGHT — the Column of Light spiral WALL, built with the exact
// same ribbon geometry as the original Lotus Bodhicitta System
// (rebuildWallGeometry / getSpiralPosition), individually triggerable per
// card. Runs as a discrete 40-NODE STEP animation: the wall snaps outward
// to include one more node, then holds/pauses there (each node sits on a
// cardinal axis — +X, +Y, -X, -Y — cycling as it spirals upward), before
// stepping to the next node. After the 40th node it holds briefly, then
// resets back to the base and repeats.
function buildColumnOfLightAnimation(root, colorOverride){
  const NODE_COUNT = COLUMN_OF_LIGHT_NODE_COUNT; // 40 discrete steps/nodes
  const DWELL_SECONDS = 0.55;   // pause duration held at each node/axis
  const STEP_SECONDS = 0.65;    // total time per node (includes the pause)
  const END_HOLD_SECONDS = 1.4; // extra pause once fully built, before looping
  const CYCLE_SECONDS = NODE_COUNT * STEP_SECONDS + END_HOLD_SECONDS;

  const mat = makeColumnOfLightWallMaterial(colorOverride);
  let wallMesh = new THREE.Mesh(buildColumnOfLightWallGeometry(0), mat);
  root.add(wallMesh);

  const tipColor = colorOverride ? new THREE.Color(colorOverride) : new THREE.Color(0xfff6c8);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.065, 16, 16), new THREE.MeshBasicMaterial({ color: tipColor }));
  root.add(tip);
  const tipLight = new THREE.PointLight(tipColor.getHex(), 1.3, 2.6);
  root.add(tipLight);

  let lastStepIndex = -1;

  return {
    extent: 2.6,
    update(t){
      const cycleT = t % CYCLE_SECONDS;
      // stepIndex counts how many nodes are currently "built" (0..NODE_COUNT)
      const stepIndex = Math.min(NODE_COUNT, Math.floor(cycleT / STEP_SECONDS) + 1);
      const withinEndHold = cycleT >= NODE_COUNT * STEP_SECONDS;
      const maxT = withinEndHold ? NODE_COUNT : stepIndex;

      // Only rebuild geometry when the step actually advances (discrete jump,
      // then hold in place for the remainder of STEP_SECONDS -- this is what
      // produces the "pausing momentarily at each axis" stepping look).
      if (maxT !== lastStepIndex) {
        lastStepIndex = maxT;
        wallMesh.geometry.dispose();
        wallMesh.geometry = buildColumnOfLightWallGeometry(maxT);
      }

      const tv = getSpiralPosition(maxT);
      tip.position.copy(tv);
      tipLight.position.copy(tv);
      tip.visible = maxT > 0.02;
      tipLight.visible = tip.visible;

      // Gentle pulse on the tip while paused at each node/axis, so the pause
      // still reads as "alive" rather than fully static.
      const pulse = 1.0 + Math.sin(t * 6.0) * 0.18;
      tip.scale.setScalar(pulse);
    },
    dispose(){
      root.remove(wallMesh); wallMesh.geometry.dispose(); mat.dispose();
      root.remove(tip); root.remove(tipLight);
    }
  };
}

// Fallback for any unrecognized new +xxx token — never silently ignored.
function buildGenericPulseAnimation(root, colorOverride, label){
  const color = colorOverride ? new THREE.Color(colorOverride) : new THREE.Color(0xffd700);
  const mat = new THREE.MeshPhysicalMaterial({ color, emissive:color, emissiveIntensity:0.7, roughness:0.25, metalness:0.3 });
  const geo = new THREE.IcosahedronGeometry(0.2, 0);
  const mesh = new THREE.Mesh(geo, mat); mesh.position.set(0,0,1.1); root.add(mesh);

  const canvas = document.createElement('canvas'); canvas.width=320; canvas.height=70;
  const ctx = canvas.getContext('2d'); ctx.font='bold 38px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#' + color.getHexString(); ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
  ctx.fillText('+'+label, 160, 36);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent:true, depthWrite:false }));
  sprite.scale.set(1.0, 0.22, 1); sprite.position.set(0,0,1.45); root.add(sprite);

  return {
    extent: 1.6,
    update(t){ const s = 0.8+Math.sin(t*2.4)*0.25; mesh.scale.setScalar(s); mesh.rotation.y = t*0.8; },
    dispose(){ root.remove(mesh); root.remove(sprite); geo.dispose(); mat.dispose(); }
  };
}
